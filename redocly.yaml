extends:
  - recommended

rules:
  # Local development only; there is no deployed server URL yet.
  no-server-example.com: off
  # Course project, not published under a license.
  info-license: off
  # GET /health takes no input, so it has no client-error response to document.
  operation-4xx-response:
    severity: warn
  # User is a required data-model component (Lab 2) with no endpoint yet.
  no-unused-components:
    severity: warn
  # /reservations/user/{userId} and /reservations/{id}/cancel|confirm share a
  # path shape, but the first is GET-only and the others are PATCH-only, so a
  # request always resolves to exactly one operation. Kept as a warning so a
  # future same-method overlap still shows up.
  no-ambiguous-paths:
    severity: warn
